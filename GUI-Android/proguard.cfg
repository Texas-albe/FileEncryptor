# R8 keep 规则（仅 Release 生效：AndroidLinkTool=r8）
#
# 崩溃现场（-b crash 实抓）：
#   InflateException: layout/abc_screen_simple_overlay_action_mode
#   Caused by: ClassNotFoundException: androidx.appcompat.widget.FitWindowsFrameLayout
#   at AppCompatDelegateImpl.createSubDecor -> AppCompatActivity.setContentView
#   at MainActivity.n_onCreate
#
# 原因：AppCompat 的布局 XML 用完整类名反射创建控件，R8 看不到 Java 代码里的引用，
# 把这些「只被 XML 引用」的 View 类整类删掉，于是 Activity 一 setContentView 就崩。
# 注意：这不是启动链路（Application/DI/Player）的问题，托管代码已经跑起来了。
-keep class androidx.appcompat.** { *; }
# nextlib/FFmpeg：JNI 按类名注册 native 方法，改名断链
-keep class io.github.anilbeesetti.** { *; }

# 其他 AndroidX 布局同样按类名反射创建控件，一并保住控件类，
# 避免修好一个再冒出下一个同类 InflateException。
-keep public class * extends android.view.View {
    public <init>(android.content.Context);
    public <init>(android.content.Context, android.util.AttributeSet);
    public <init>(android.content.Context, android.util.AttributeSet, int);
}

-keep public class * extends android.view.ViewGroup {
    public <init>(android.content.Context);
    public <init>(android.content.Context, android.util.AttributeSet);
    public <init>(android.content.Context, android.util.AttributeSet, int);
}

