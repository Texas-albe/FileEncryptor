name: CI

# FileEncryptor 持续集成：Windows/Linux 构建 + 冒烟往返 + ASan + clang-tidy。
# 触发：push（忽略文档/Updates 路径）、PR、手动、tag v*。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore: ["Updates/**", "The Next Release/**", "**/*.md"]
  pull_request:
    paths-ignore: ["Updates/**", "The Next Release/**", "**/*.md"]
  workflow_dispatch:

jobs:
  windows-build:
    name: Windows x64 Release
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Configure (VS2022 generator, x64)
        run: |
          cmake -S CLI -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Smoke test (--help)
        run: |
          $exe = Get-ChildItem "build\bin" -Filter "FileEncryptorCLI-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "CLI binary not found under build/bin" }
          & $exe.FullName --help | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "help smoke failed" }

      - name: Round-trip encrypt/decrypt
        run: powershell -File scripts/ci_smoke.ps1 -CliDir build/bin

  linux-build:
    name: Linux Release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsodium-dev libyaml-cpp-dev

      - name: Configure (Ninja, Release)
        run: cmake -S CLI -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke test (--help)
        run: |
          set -e
          exe=$(ls build/bin/FileEncryptorCLI-* | head -n1)
          "$exe" --help

      - name: Round-trip encrypt/decrypt
        run: bash scripts/ci_smoke.sh -d build/bin

  linux-asan:
    name: Linux ASan (Debug)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsodium-dev libyaml-cpp-dev

      - name: Configure (ASan)
        run: cmake -S CLI -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFE_ENABLE_ASAN=ON

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Round-trip under ASan (leak detection)
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          bash scripts/ci_smoke.sh -d build-asan/bin
          echo "ASan round-trip OK"

  clang-tidy:
    name: clang-tidy (core/)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tidy libsodium-dev libyaml-cpp-dev

      - name: Generate compile_commands.json
        run: |
          cmake -S CLI -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target FileEncryptor -j2 >/dev/null 2>&1 || true

      - name: Run clang-tidy on core/ and cli/
        run: |
          set +e
          clang-tidy -p build -quiet \
            $(find CLI/core CLI/cli -name '*.cpp' -not -path '*/.vs/*') 2>&1 | tee clang-tidy.log
          # 只统计 error 级问题；warning 不阻断（历史存量多，逐步清零）
          if grep -E "error:" clang-tidy.log | grep -v "no matching" | grep -q .; then
            echo "clang-tidy errors found"
            grep -E "error:" clang-tidy.log | head -n 30
            exit 1
          fi
          echo "clang-tidy: no errors (warnings allowed)"
